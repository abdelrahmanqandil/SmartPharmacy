node_id = 2

data_dir = "./marmot-data-edge"

[storage]
type = "sqlite"
path = "./edge.db"
busy_timeout = 5000

[transport]
type = "nats"
address = "nats://127.0.0.1:4222"

[replication]
mode = "multi-master"
delta_sync_threshold_transactions = 1

[cluster]
grpc_port = 8081
seed_nodes = ["127.0.0.1:8080"]
grpc_advertise_address = "127.0.0.1:8081"
